global:
  scrape_interval: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [certification-service:8080, broker-service:8080, workflow-service:8080, fix-simulator:8080]
  - job_name: mcp
    static_configs:
      - targets: [certification-mcp:8201, fix-mcp:8202, knowledge-mcp:8203, operations-mcp:8204]
  - job_name: agents
    static_configs:
      - targets: [agent-orchestrator:8100]
