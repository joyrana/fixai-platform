{{- if .Values.telemetry.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fixai-platform
  labels:
    {{- include "fixai.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/part-of: fixai-platform }
  endpoints:
    - { port: http, path: /actuator/prometheus, interval: 15s }
    - { port: http, path: /metrics, interval: 15s }
{{- end }}
