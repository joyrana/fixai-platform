[project]
name = "fixai-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "FIXAI Python workspace: AI agents, MCP servers and the evaluation harness"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ai/*", "mcp/*", "evals"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S311"]
