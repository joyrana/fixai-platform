name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and coverage
        run: mvn -B -ntp clean verify
      - name: Generate SBOM
        run: mvn -B -ntp -f backend/parent-pom/pom.xml org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DoutputFormat=json
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            backend/*/target/surefire-reports/
            backend/*/target/site/jacoco/
            backend/parent-pom/target/bom.json
          if-no-files-found: ignore

  python:
    name: AI layer (lint, tests, contracts, evaluation gates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIXAI_LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install workspace (locked)
        run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check ai mcp evals
      - name: Unit and integration tests
        run: uv run pytest
      - name: Tool and agent contracts are current
        run: uv run python -m fixai_evals.contracts --check
      - name: Evaluation gates (offline, deterministic)
        run: |
          uv run python -m fixai_evals.cli run --suite agent-smoke --min-success 1.0
          uv run python -m fixai_evals.cli run --suite workflow --min-success 1.0
          uv run python -m fixai_evals.cli run --suite safety --min-success 1.0
          uv run python -m fixai_evals.cli run --suite rag-quality --split all --min-success 0.9
          uv run python -m fixai_evals.cli run --suite agent-regression --split dev --min-success 1.0
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/*.json
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
