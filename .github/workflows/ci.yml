name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and coverage
        run: mvn -B -ntp clean verify
      - name: Generate SBOM
        run: mvn -B -ntp -f backend/parent-pom/pom.xml org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DoutputFormat=json
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            backend/*/target/surefire-reports/
            backend/*/target/site/jacoco/
            backend/parent-pom/target/bom.json
          if-no-files-found: ignore

  python:
    name: AI layer (lint, tests, contracts, evaluation gates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIXAI_LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install workspace (locked)
        run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check ai mcp evals e2e
      - name: Unit and integration tests
        run: uv run pytest
      - name: Tool and agent contracts are current
        run: uv run python -m fixai_evals.contracts --check
      - name: Evaluation gates (offline, deterministic)
        run: |
          uv run python -m fixai_evals.cli run --suite agent-smoke --min-success 1.0
          uv run python -m fixai_evals.cli run --suite workflow --min-success 1.0
          uv run python -m fixai_evals.cli run --suite safety --min-success 1.0
          uv run python -m fixai_evals.cli run --suite rag-quality --split all --min-success 0.9
          uv run python -m fixai_evals.cli run --suite agent-regression --split dev --min-success 1.0
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/*.json
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (compose stack, API journeys, browser smoke)
    needs: [java, python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Package services
        run: mvn -B -ntp package -DskipTests
      - name: Build and start the platform
        run: docker compose -f infra/docker/docker-compose.yml --profile platform up -d --build --wait --wait-timeout 600
      - name: API journeys across services
        run: |
          uv sync --all-packages --frozen
          FIXAI_E2E_BASE_URL=http://localhost:3000 uv run pytest e2e -v
      - name: Browser smoke test
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          FIXAI_UI_URL=http://localhost:3000 npx playwright test
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml --profile platform logs --no-color --tail 300
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
