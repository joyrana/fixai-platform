[project]
name = "fixai-operations-mcp"
version = "0.1.0"
description = "FIXAI operations MCP server"
requires-python = ">=3.11,<3.14"
dependencies = ["fixai-common"]

[project.scripts]
fixai-operations-mcp = "fixai_operations_mcp.server:main"

[tool.uv.sources]
fixai-common = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixai_operations_mcp"]
