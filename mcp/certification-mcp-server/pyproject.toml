[project]
name = "fixai-certification-mcp"
version = "0.1.0"
description = "MCP tools over the deterministic certification engine (read and simulated-write only)"
requires-python = ">=3.11,<3.14"
dependencies = ["fixai-common"]

[project.scripts]
fixai-certification-mcp = "fixai_certification_mcp.server:main"

[tool.uv.sources]
fixai-common = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixai_certification_mcp"]
