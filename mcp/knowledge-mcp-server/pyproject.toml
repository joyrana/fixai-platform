[project]
name = "fixai-knowledge-mcp"
version = "0.1.0"
description = "Versioned knowledge ingestion, hybrid retrieval with citations and access control, exposed as MCP tools"
requires-python = ">=3.11,<3.14"
dependencies = ["fixai-common", "pyyaml==6.0.3"]

[project.scripts]
fixai-knowledge-mcp = "fixai_knowledge_mcp.server:main"
fixai-knowledge = "fixai_knowledge_mcp.cli:main"

[tool.uv.sources]
fixai-common = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixai_knowledge_mcp"]
