spring:
  application:
    name: broker-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fixai}
    username: ${POSTGRES_USER:fixai}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
    hikari:
      schema: broker
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    schemas: broker
    default-schema: broker
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

fixai:
  security:
    enabled: ${FIXAI_SECURITY_ENABLED:false}
    issuer-uri: ${FIXAI_OIDC_ISSUER_URI:}
    audience: ${FIXAI_OIDC_AUDIENCE:fixai-platform}
    cors-allowed-origins: ${FIXAI_CORS_ORIGINS:http://localhost:5173}
    client:
      token-uri: ${FIXAI_OIDC_TOKEN_URI:}
      client-id: ${FIXAI_CLIENT_ID:broker-service}
      client-secret: ${FIXAI_CLIENT_SECRET:}
  broker:
    workflow-url: ${WORKFLOW_SERVICE_URL:http://localhost:8084}
  audit:
    workflow-url: ${WORKFLOW_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
