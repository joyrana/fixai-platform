id: NEG-007
version: 1
title: Limit order without price rejected
description: A limit order without Price must be rejected and never filled.
category: NEGATIVE
fixVersions: [FIX42, FIX44, FIX50SP2]
tags: [order-lifecycle, reject, price]
steps:
  - logon: {timeoutMs: 10000}
  - send:
      description: Limit order without Price
      msgType: D
      fields:
        ClOrdID: "${id:o1}"
        HandlInst: "1"
        Symbol: AAPL
        Side: "1"
        TransactTime: "${now}"
        OrderQty: "10"
        OrdType: "2"
  - expect:
      description: Order rejected
      msgType: "8"
      match: {ClOrdID: "${id:o1}"}
      assert:
        ExecType: {equals: "8"}
        OrdStatus: {equals: "8"}
        Text: {present: true}
