[project]
name = "fixai-knowledge-agent"
version = "0.1.0"
description = "Knowledge agent: cited answers from approved FIX documentation, abstains when unsupported"
requires-python = ">=3.11,<3.14"
dependencies = ["fixai-common"]

[project.scripts]
fixai-knowledge-agent = "fixai_knowledge_agent.app:main"

[tool.uv.sources]
fixai-common = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixai_knowledge_agent"]
