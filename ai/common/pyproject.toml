[project]
name = "fixai-common"
version = "0.1.0"
description = "Small, versioned shared contracts for FIXAI agents and MCP servers: schemas, LLM provider interface, telemetry, guards and platform clients"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "anthropic==1.11.0",
    "mcp==2.3.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "prometheus-client==0.26.0",
    "pyjwt[crypto]==2.15.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixai_common"]
